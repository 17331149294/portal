name: build-release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64, os: windows, arch: amd64, ext: .exe }
          - { name: windows-386,   os: windows, arch: 386,   ext: .exe }
          - { name: windows-arm64, os: windows, arch: arm64, ext: .exe }
          - { name: windows-arm,   os: windows, arch: arm,   ext: .exe }
          - { name: linux-amd64,   os: linux,   arch: amd64, ext: "" }
          - { name: linux-386,     os: linux,   arch: 386,   ext: "" }
          - { name: linux-arm64,   os: linux,   arch: arm64, ext: "" }
          - { name: linux-arm,     os: linux,   arch: arm,   ext: "" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build ${{ matrix.name }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          out="portal_${GOOS}_${GOARCH}${{ matrix.ext }}"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$out" .
          ls -lh "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-${{ matrix.name }}
          path: portal_*${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect binaries
        run: |
          mkdir -p dist/bin
          find dist -type f \( -name 'portal_*.exe' -o -name 'portal_linux_*' \) -exec cp {} dist/bin/ \;
          ls -lh dist/bin
          cd dist/bin
          sha256sum portal_* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bin/*
          generate_release_notes: true
          draft: false
          prerelease: false
